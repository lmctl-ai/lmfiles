name: ci

on:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  LMFILES_MAX_MEMORY_MB: '256'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64, graal: '25.0.2'}
          - {os: ubuntu-22.04-arm, name: linux-arm64, graal: '25.0.2'}
          - {os: macos-15-intel, name: macos-x64, graal: '25.0.1'}
          - {os: macos-15, name: macos-arm64, graal: '25.0.2'}
          - {os: windows-2022, name: windows-x64, graal: '25.0.2'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: ${{ matrix.graal }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq build-essential zlib1g-dev
      - name: macOS timeout
        if: runner.os == 'macOS'
        run: brew install coreutils && echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install pinned lmscript compiler
        run: npm install -g @lmctl-ai/lmctl@0.2.420
      - name: Managed build and local gate
        run: timeout 1800 bash test.sh
      - name: Native build
        run: timeout 2400 bash scripts/build-native.sh
      - name: Native local gate
        run: timeout 1800 bash test.sh --native
      - name: Name the tested executable per platform
        run: |
          mkdir -p dist
          exe=target/lmfiles
          suffix=
          if [ -f target/lmfiles.exe ]; then exe=target/lmfiles.exe; suffix=.exe; fi
          test -f "$exe"
          cp "$exe" "dist/lmfiles-${{ matrix.name }}$suffix"
      - name: Upload tested executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lmfiles-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish the five tested binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -type f -name 'lmfiles-*' | wc -l)" -eq 5
          sha256sum lmfiles-* > SHA256SUMS
          timeout 180 gh release create "$GITHUB_REF_NAME" lmfiles-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes 'One native executable per platform; Java is not required. Local-only file lifecycle registry (no network access). Linux requires glibc 2.35 or newer.'
